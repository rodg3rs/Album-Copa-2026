<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login - Troca de Figurinhas</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="form-container">
    <h2><i class="fa-regular fa-circle-user"></i> Login</h2>
    <form id="login-form">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required>

      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" required>

      <button type="submit"><i class="fa-solid fa-right-to-bracket"></i> Entrar</button>
    </form>
    <div id="login-msg"></div>
  </div>

  <script>
    document.getElementById("login-form").addEventListener("submit", async function(e) {
      e.preventDefault();

      const nome = document.getElementById("nome").value;
      const senha = document.getElementById("senha").value;

      try {
        const response = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nome, senha })
        });

        const result = await response.json();
        const msgDiv = document.getElementById("login-msg");

        if (result.success) {
          msgDiv.innerHTML = `<p style="color:green;">${result.message}</p>`;

          // Atualiza o topo com nome do usuário
          window.parent.document.getElementById("login-status").textContent = "Logado como " + result.nome;
          window.parent.document.getElementById("login-link").innerHTML = `
            <i class="fa-solid fa-user-check"></i>
            <span>${result.nome}</span>
          `;

          // Redireciona para home ou álbum dentro do dashboard
          setTimeout(() => {
            window.parent.document.getElementById("content-frame").src = "home.html";
          }, 2000);
        } else {
          msgDiv.innerHTML = `<p style="color:red;">${result.error || result.message}</p>`;
        }
      } catch (err) {
        document.getElementById("login-msg").innerHTML = `<p style="color:red;">Erro de conexão com servidor</p>`;
      }
    });
  </script>
</body>
</html>
