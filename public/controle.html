<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle de Figurinhas</title>
  <link rel="stylesheet" href="style.css">
  <style>
    table.album {
      border-collapse: collapse;
      width: 100%;
    }
    table.album th, table.album td {
      border: 1px solid #ccc;
      text-align: center;
      padding: 4px;
    }
    table.album th {
      background: #f0f0f0;
    }
.stamp-cell {
  width: 40px;
  height: 30px;
  cursor: pointer;
  text-align: center;
  vertical-align: middle;
    }
    .stamp-cell.black {
      background: #000;
      color: #000; /* esconde código */
    }
/* Para o modo Repetidas (R): quando NÃO marcada, fica cinza claro e mostra número */
.stamp-cell.gray {
  background: #ccc;   /* tom acinzentado */
  color: #333;        /* número visível */
}
/* Repetidas (R): marcada → fundo amarelo, número em negrito */
.stamp-cell.yellow {
  background: #ffeb3b; /* amarelo */
  color: #000;
  font-weight: bold;
}	
    .stamp-cell.checked {
      outline: 2px solid #2b8aef;
    }
  </style>
</head>
<body>
<h2 id="title">
  Meu Álbum <span id="thermometer"></span>
</h2>

<div class="album-wrapper">
  <form id="album-form">
    <table class="album" id="album-table"></table>
    <button type="submit">Salvar</button>
    <button type="button" onclick="voltar()">Voltar</button>
  </form>
</div>

<div id="msg"></div>

<script>
  // Lista completa das 48 seleções
  const teams = [
    "MEX","RSA","KOR","CZE","CAN","BIH","QAT","SUI","BRA","MAR","HAI","SCO","USA","PAR","AUS","TUR",
    "GER","CUW","CIV","ECU","NED","JPN","SWE","TUN","BEL","EGY","IRN","NZL","ESP","CPV","KSA","URU",
    "FRA","SEN","IRQ","NOR","ARG","ALG","AUT","JOR","POR","COD","UZB","COL","ENG","CRO","GHA","PAN"
  ];

  const params = new URLSearchParams(window.location.search);
  const view = params.get("view") || "album";
  const tipo = view === "repetidas" ? "R" : "A";
  if (view === "repetidas") {
  document.getElementById("title").textContent = "Minhas Repetidas";
} else {
  document.getElementById("title").innerHTML = 'Meu Álbum <span id="thermometer"></span>';
}
  const table = document.getElementById("album-table");

  // Monta tabela completa
  function buildTable() {
let header = "<tr><th>Seleção</th>";
for (let i=1;i<=20;i++) header += `<th>${i}</th>`;
header += "</tr>";
table.innerHTML = header;

    // FWC iniciais (0–8)
    let rowFWC = `<tr><th>FWC 0–8</th>`;
    for (let i=0;i<=8;i++) {
      const code = `FWC${i}`;
      rowFWC += `<td class="stamp-cell" data-stamp="${code}">${i}</td>`;
    }
    rowFWC += "</tr>";
    table.innerHTML += rowFWC;

    // Seleções
    for (let team of teams) {
      let row = `<tr><th>${team}</th>`;
      for (let i=1;i<=20;i++) {
        const code = `${team}${i}`;
        row += `<td class="stamp-cell" data-stamp="${code}">${i}</td>`;
      }
      row += "</tr>";
      table.innerHTML += row;
    }

    // FWC adicionais (9–19)
    let rowFWC2 = `<tr><th>FWC 9–19</th>`;
    for (let i=9;i<=19;i++) {
      const code = `FWC${i}`;
      rowFWC2 += `<td class="stamp-cell" data-stamp="${code}">${i}</td>`;
    }
    rowFWC2 += "</tr>";
    table.innerHTML += rowFWC2;

    // Coca-Cola (CC1–CC14)
    let rowCC = `<tr><th>Coca-Cola</th>`;
    for (let i=1;i<=14;i++) {
      const code = `CC${i}`;
      rowCC += `<td class="stamp-cell" data-stamp="${code}">${i}</td>`;
    }
    rowCC += "</tr>";
    table.innerHTML += rowCC;
  }

    // Atualiza visual conforme regra
function updateVisual(cell, checked) {
  if (view === "album") {
    // Álbum: marcada → preto, desmarcada → branco translúcido
    if (checked) {
      cell.classList.add("black");
      cell.classList.remove("transparent");
      cell.classList.remove("gray");
      cell.classList.remove("yellow");
    } else {
      cell.classList.remove("black");
      cell.classList.add("transparent"); // aplica branco translúcido
      cell.classList.remove("gray");
      cell.classList.remove("yellow");
    }
  } else {
    // Repetidas: marcada → amarelo + negrito, desmarcada → cinza
    if (checked) {
      cell.classList.add("yellow");
      cell.classList.remove("gray");
      cell.classList.remove("transparent");
    } else {
      cell.classList.remove("yellow");
      cell.classList.add("gray");
      cell.classList.remove("transparent");
    }
  }
}

    // Carrega existentes
async function loadExisting() {
  const res = await fetch(`/controle?tipo=${tipo}`);
  const data = await res.json();
  if (!data.success) return;

  const existing = new Set(data.stamps || []);
  document.querySelectorAll(".stamp-cell").forEach(cell=>{
    const code = cell.dataset.stamp;
    const has = existing.has(code);
    cell.dataset.checked = has ? "true" : "false";
    updateVisual(cell, has);
  });

  // só calcula se for "Meu Álbum"
  if (tipo === "A") {
    const thermometer = document.getElementById("thermometer");
    if (thermometer) {
      thermometer.textContent = `(Faltam ${faltam} figurinhas)`;
    }
  }
}
    // Clique alterna
    table.addEventListener("click", e=>{
      if (e.target.classList.contains("stamp-cell")) {
        const cell = e.target;
        const checked = cell.dataset.checked === "true";
        cell.dataset.checked = (!checked).toString();
        updateVisual(cell, !checked);
      }
    });

    // Salvar
    document.getElementById("album-form").addEventListener("submit", async e=>{
      e.preventDefault();
      const checked = Array.from(document.querySelectorAll(".stamp-cell"))
        .filter(c=>c.dataset.checked==="true")
        .map(c=>c.dataset.stamp);
      const res = await fetch("/controle", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ tipo, stamps: checked })
      });
      const data = await res.json();
  if (data.success) {
    alert("Atualizado!");
    // recalcula faltantes
    loadExisting();
  } else {
    alert(data.error);
  }
});

    function voltar() {
      window.parent.document.getElementById("content-frame").src = "home.html";
    }

    buildTable();
    loadExisting();
  </script>
</body>
</html>
