<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro - Troca de Figurinhas</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="form-container">
    <h2><i class="fa-regular fa-circle-user"></i> Cadastro</h2>
    <form id="cadastro-form">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" required>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" required>

      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha" required>

      <button type="submit"><i class="fa-solid fa-user-plus"></i> Cadastrar</button>
    </form>
    <div id="cadastro-msg"></div>
  </div>

<script>
  document.getElementById("cadastro-form").addEventListener("submit", async function(e) {
    e.preventDefault();

    const nome = document.getElementById("nome").value;
    const email = document.getElementById("email").value;
    const senha = document.getElementById("senha").value;

    try {
      const response = await fetch("/cadastro", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nome, email, senha })
      });

      const result = await response.json();
      const msgDiv = document.getElementById("cadastro-msg");

      if (result.success) {
        msgDiv.innerHTML = `<p style="color:green;">${result.message}</p>`;
        // volta ao login dentro do dashboard
        setTimeout(() => {
          window.parent.document.getElementById("content-frame").src = "login.html";
        }, 2000);
      } else {
        msgDiv.innerHTML = `<p style="color:red;">Erro: ${result.error || result.message}</p>`;
      }
    } catch (err) {
      document.getElementById("cadastro-msg").innerHTML = `<p style="color:red;">Erro de conexão com servidor</p>`;
    }
  });
</script>

</body>
</html>
