<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Troca de Figurinhas - Copa 2026</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<!-- Container Superior -->
<header id="top-container">
  <h1>Troca de Figurinhas</h1>
  <div id="user-info">
    <span id="login-status"></span>
    <a href="login.html" target="content-frame" id="login-link">
      <i class="fa-regular fa-circle-user"></i>
      <span>Login</span>
    </a>
  </div>
</header>

  <!-- Container Central -->
  <main id="main-container">
    <iframe id="content-frame" name="content-frame"></iframe>
  </main>

<!-- Container Inferior (Menu) -->
<footer id="bottom-container">
  <nav>
    <ul>
      <li>
        <a href="cadastro.html" target="content-frame">
          <i class="fa-regular fa-circle-user"></i>
          <span>Cadastrar</span>
        </a>
      </li>
      <li>
        <a href="controle.html" target="content-frame">
          <i class="fa-solid fa-book"></i>
          <span>Meu Álbum</span>
        </a>
      </li>
      <li>
        <a href="controle.html?view=repetidas" target="content-frame">
          <i class="fa-solid fa-clone"></i>
          <span>Repetidas</span>
        </a>
      </li>
      <li>
        <a href="eu-quero.html?view=quero" target="content-frame">
          <i class="fa-solid fa-star"></i>
          <span>Eu Quero</span>
        </a>
      </li>
      <li>
        <a href="eu-troco.html?view=troco" target="content-frame">
          <i class="fa-solid fa-arrows-rotate"></i>
          <span>Eu Troco</span>
        </a>
      </li>
      <li>
        <a href="chat.html" target="content-frame">
          <i class="fa-regular fa-comments"></i>
          <span>Chat</span>
        </a>
      </li>
      <li>
	<a href="#" id="menu-sair">
	  <i class="fa-solid fa-right-from-bracket"></i>
	  <span>Sair</span>
	</a>
      </li>
    </ul>
  </nav>
</footer>

<script>
  // Função para atualizar menu conforme login
  function updateMenu(loggedIn) {
    // Sempre habilitado
    document.getElementById("menu-sair").style.display = "inline";

    if (loggedIn) {
      // Esconde login/cadastrar
      document.getElementById("menu-login").style.display = "none";
      document.getElementById("menu-cadastrar").style.display = "none";

      // Mostra opções logado
      document.getElementById("menu-album").style.display = "inline";
      document.getElementById("menu-repetidas").style.display = "inline";
      document.getElementById("menu-quero").style.display = "inline";
      document.getElementById("menu-troco").style.display = "inline";
      document.getElementById("menu-chat").style.display = "inline";
    } else {
      // Mostra login/cadastrar
      document.getElementById("menu-login").style.display = "inline";
      document.getElementById("menu-cadastrar").style.display = "inline";

      // Esconde opções logado
      document.getElementById("menu-album").style.display = "none";
      document.getElementById("menu-repetidas").style.display = "none";
      document.getElementById("menu-quero").style.display = "none";
      document.getElementById("menu-troco").style.display = "none";
      document.getElementById("menu-chat").style.display = "none";
    }
  }

  // Logout simples
  document.getElementById("menu-sair").addEventListener("click", async (e) => {
    e.preventDefault();
    await fetch("/logout", { credentials: "include" });
    updateMenu(false); // volta para estado não logado
    window.location.href = "index.html";
  });

  // Exemplo: ao carregar a página, verificar sessão
  async function checkSession() {
    try {
      const res = await fetch("/session", { credentials: "include" });
      const data = await res.json();
      updateMenu(data.loggedIn);
    } catch {
      updateMenu(false);
    }
  }

  checkSession();
</script>



</body>
</html>
