<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Troca de Figurinhas - Copa 2026</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- Container Superior -->
<header id="top-container">
  <h1 id="main-title">
  Troca de Figurinhas <span class="subtitle">by Rodg3rs</span>
  </h1>
  <div id="user-info">
    <span id="login-status"></span>
    <a href="login.html" target="content-frame" id="login-link">
      <i class="fa-regular fa-circle-user"></i>
      <span>Login</span>
    </a>
  </div>
</header>

  <!-- Container Central -->
  <main id="main-container">
    <iframe id="content-frame" name="content-frame" src="home.html"></iframe>
  </main>

<!-- Container Inferior (Menu) -->
<footer id="bottom-container">
  <nav>
    <ul>
      <li>
        <a href="cadastro.html" target="content-frame">
          <i class="fa-regular fa-circle-user"></i>
          <span>Cadastrar</span>
        </a>
      </li>
      <li>
	<a href="controle.html" target="content-frame">
          <i class="fa-regular fa-futbol"></i>
          <span>Meu Álbum</span>
        </a>
      </li>
      <li>
        <a href="controle.html?view=repetidas" target="content-frame">
          <i class="fa-regular fa-clone"></i>
          <span>Repetidas</span>
        </a>
      </li>
      <li>
        <a href="eu-quero.html?view=quero" target="content-frame">
          <i class="fa-regular fa-star"></i>
          <span>Eu Quero</span>
        </a>
      </li>
      <li>
        <a href="eu-troco.html?view=troco" target="content-frame">
          <i class="fa-regular fa-handshake"></i>
          <span>Eu Troco</span>
        </a>
      </li>
      <li>
        <a href="chat.html" target="content-frame">
          <i class="fa-regular fa-comments"></i>
          <span>Chat</span>
        </a>
      </li>
      <li>
	<a href="#" id="menu-sair">
	  <i class="fa-regular fa-circle-xmark"></i>
	  <span>Sair</span>
	</a>
      </li>
    </ul>
  </nav>
</footer>

<script>
  document.getElementById("menu-sair").addEventListener("click", async (e) => {
    e.preventDefault();
    await fetch("/logout", { credentials: "include" });
    window.location.href = "index.html";
  });

  // Script para marcar item ativo no menu
document.querySelectorAll('#bottom-container nav ul li a').forEach(link=>{
  link.addEventListener('click', ()=>{
    document.querySelectorAll('#bottom-container nav ul li a').forEach(l=>l.classList.remove('active'));
    link.classList.add('active');
  });
});

</script>

</body>
</html>
